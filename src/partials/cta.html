<section class="cta-wrap" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta" data-reveal>
      <h2 class="display" id="cta-title">پتتان نگرانتان کرده؟</h2>
      <p>برای شروع فقط چند خط دربارهٔ او بنویسید. بقیهٔ مسیر را با هم می‌رویم.</p>
      <div class="cta__actions">
        <a class="btn btn--go btn--light btn--lg" href="contact.html#form">رزرو نوبت<span class="btn__ico"><svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></span></a>
        <a class="cta__tel" href="tel:{{site.phoneTel}}"><span class="ltr">{{site.phone}}</span></a>
      </div>
    </div>
  </div>
</section>

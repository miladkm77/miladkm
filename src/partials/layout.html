<link rel="preload" href="assets/fonts/vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Progressive enhancement gate. "motion" = GSAP may take over; if the library
   fails to load within 4s the page falls back to plain, fully readable HTML. */
(function (d) {
  var r = d.documentElement;
  r.classList.add('js');
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    r.classList.add('motion');
    setTimeout(function () {
      if (!window.__gsapOK) r.classList.remove('motion', 'fip-live');
    }, 4000);
  }
})(document);
</script>
<link rel="stylesheet" href="assets/css/style.css?v={{v}}">
</head>
<body class="page-{{body}}">
